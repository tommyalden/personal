<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/f9df394a70.js" crossorigin="anonymous"></script>

        <title>Tommy Alden</title>
        <meta name="description" content="1st Year Computer Science Student at the University of Bristol.">
        <meta property="og:type" content="website">
        <link rel="icon" type="image/svg+xml" href="./media/favicon.svg" />
        <link rel="icon" type="image/x-icon" href="./media/favicon.ico">
    </head>
    <body>
        <header>
            <a class="icon" href="https://github.com/tommyalden">
                <i class="fa-brands fa-github github icon" /></i>
            </a>
            <h1 class="header-title"><a href="/" style="color: var(--text); text-decoration: none;">Tommy Alden</a></h1>
        </header>
        <main>
            <img id="image" alt="Random Photo" />

            <script>
                const image = Math.floor(Math.random() * 6) + 1;

                document.getElementById("image").src = "./media/" + image + ".jpg"
            </script>

            <p class="current-role">1st Year Computer Science Student at the University of Bristol.</p>
            <div class="icons">
                <a class="icon" href="./tommyalden-cv.pdf">
                    <i class="fa-solid fa-file-lines fa-2x icon"></i>
                </a> 
                <a class="icon" href="mailto:tommy@talden.dev">
                    <i class="fa-solid fa-envelope fa-2x icon"></i>
                </a> 
                <a class="icon" href="https://linkedin.com/in/tommy-alden">
                    <i class="fa-brands fa-linkedin fa-2x icon"></i>
                </a>
                <a class="icon" href="https://x.com/talden_">
                    <i class="fa-brands fa-twitter fa-2x icon"></i>
                </a>
            </div>
        </main>
    </body>
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --text: #e0e0e0;    
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }


        html {
            font-family: 'jetbrains mono';
            font-size: clamp(1rem, 1.5vw + 0.5rem, 1.5rem);
        }

        html, body {
            background-color: var(--bg);
            height: 100%;
            margin: 0;
        }

        body {
            padding: 1rem;

            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6, p, img {
            color: var(--text);
            margin: 0 0;
        }

        header {
            margin-bottom: 0.5rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .github {
            font-size: 2.5em;
        }

        .header-title {
            font-weight: bold;
            float: right;
        }

        main {
            display: flex;
            flex: 1;
            
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: 6rem;
            gap: 1rem;
        }

        #image {
            width: clamp(200px, 50vw, 400px);
            aspect-ratio: 1;
            object-fit: cover;

            display: block;
            text-align: center;
            line-height: 200px;
        }

        .current-role {
            text-align: center;
        }

        .icons {
            width: clamp(250px, 60%, 450px);

            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .icon {
            color: var(--text);
            transition: all 0.2s ease;
        }

        .icon:hover {
            transform: translatey(-2px);
        }
    </style>
</html>
